[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceroot"
version = "0.1.0"
description = "Offline evidence-grounded infrastructure debugging and performance analysis core"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
traceroot = "traceroot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
